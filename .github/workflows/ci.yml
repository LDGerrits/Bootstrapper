name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Check Formatting
        run: stylua --check src tests

      - name: Lint
        run: |
          selene src
          cd tests && selene .

      - name: Test
        run: lune run tests/run
