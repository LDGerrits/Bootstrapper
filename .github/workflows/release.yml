name: Release

on:
  release:
    types:
      - published

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Build Model
        run: rojo build default.project.json -o Bootstrapper.rbxm

      - name: Upload Model
        run: gh release upload "${{ github.event.release.tag_name }}" Bootstrapper.rbxm
        env:
          GH_TOKEN: ${{ github.token }}
