name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Build Model
        run: rojo build default.project.json -o Bootstrapper.rbxm

      - name: Create Release
        run: gh release create "${{ github.ref_name }}" Bootstrapper.rbxm --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
